<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Site -->
    <title>
      Plugged by Ayeley | Original UK-Sourced Products Delivered in Ghana
    </title>

    <meta
      name="description"
      content="Shop authentic UK-sourced toiletries, supplements, perfumes, snacks, beauty and hair care products. Plugged by Ayeley delivers original products across Ghana."
    />

    <meta
      name="keywords"
      content="UK sourced products Ghana, original products Accra, toiletries Ghana, supplements Ghana, perfumes Ghana, beauty skincare Ghana, hair care Ghana, buy UK products online Ghana, Plugged by Ayeley"
    />

    <meta
      name="author"
      content="Plugged by Ayeley"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#170a10"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://pluggedbyayeley.com/"
    />

    <!-- Favicon -->
    <link rel="icon" href="/plugged-by-ayeley-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/plugged-by-ayeley-icon.png" />

    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Plugged by Ayeley"
    />

    <meta
      property="og:url"
      content="https://pluggedbyayeley.com/"
    />

    <meta
      property="og:title"
      content="Plugged by Ayeley | Original UK-Sourced Products Delivered in Ghana"
    />

    <meta
      property="og:description"
      content="Shop authentic UK-sourced toiletries, supplements, perfumes, snacks, beauty and hair care products. Delivered across Ghana."
    />

    <meta
      property="og:locale"
      content="en_GH"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:url"
      content="https://pluggedbyayeley.com/"
    />

    <meta
      name="twitter:title"
      content="Plugged by Ayeley | Original UK-Sourced Products Delivered in Ghana"
    />

    <meta
      name="twitter:description"
      content="Shop authentic UK-sourced toiletries, supplements, perfumes, snacks, beauty and hair care products. Delivered across Ghana."
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Plugged by Ayeley",
        "url": "https://pluggedbyayeley.com/",
        "description": "Original UK-sourced products delivered across Ghana. Shop authentic toiletries, supplements, perfumes, snacks, beauty and hair care products.",
        "slogan": "Stay Plugged In",
        "areaServed": {
          "@type": "Country",
          "name": "Ghana"
        }
      }
    </script>

    <!-- Website structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Plugged by Ayeley",
        "url": "https://pluggedbyayeley.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://pluggedbyayeley.com/shop?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
